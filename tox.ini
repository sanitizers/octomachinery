[tox]
envlist = python
minversion = 3.21.0
requires =
  setuptools >= 40.9.0
  pip >= 19.0.3
  # tox-venv >= 0.4.0
isolated_build = true


[testenv]
package = wheel
wheel_build_env = .pkg
basepython = python3
isolated_build = true
usedevelop = false
extras =
  testing
deps =
  # NOTE: pytest-asyncio v1 dropped the `event_loop` fixture that the test
  # NOTE: suite still requests via `@pytest.mark.usefixtures('event_loop')`.
  # NOTE: Drop this constraint once those usages are gone.
  pytest-asyncio < 1
  # NOTE: cryptography announces the end of its support for an
  # NOTE: interpreter through a `CryptographyDeprecationWarning` raised
  # NOTE: on import, which `filterwarnings = error` in `pytest.ini`
  # NOTE: turns into a collection error. Each ceiling below is the first
  # NOTE: release that warns for the interpreter it is pinned to:
  # NOTE: * v44 and v45 warn on Python 3.7, with v46 dropping it;
  # NOTE: * v47 warns on Python 3.8, with v48 dropping it — v46 is the
  # NOTE:   one release in between that warns on neither.
  # NOTE: Drop each ceiling once its Python leaves the matrix.
  cryptography < 44; python_version < "3.8"
  cryptography < 47; python_version == "3.8"
commands =
  {envpython} -m \
    pytest \
    {tty:--color=yes} \
    {posargs:--cov-report=term-missing:skip-covered}


[testenv:old-deps]
description =
  Run tests with the lowest possible dependency versions as opposed to
  using the latest ones
commands_pre =
  # NOTE: Not using `deps = ` for this because installing the dist
  # NOTE: happens later and overrides it. Ceilings usually survive that
  # NOTE: install, so they can live in `deps = ` — but only as long as
  # NOTE: nothing in the dist's dependency tree requires a version above
  # NOTE: them; exact floors never survive it, since any newer transitive
  # NOTE: requirement simply overrides them.
  # NOTE: With this step we're setting certain packages to the lowest
  # NOTE: versions — either limited by the runtime deps or just known
  # NOTE: to work.
  # NOTE: For example, PyJWT versions below 1.4.2 cause TypeError when
  # NOTE: the PEM key is passed as bytes.
  # Ref: https://github.com/sanitizers/octomachinery/issues/46:
  # NOTE: Some floors are only reachable on the interpreters that were
  # NOTE: around when they were released, so they carry environment
  # NOTE: markers:
  # NOTE: * Python 3.12 dropped the `find_module()` import fallback and
  # NOTE:   `pkgutil.ImpImporter` that the 2019-era setuptools and the
  # NOTE:   2017-era setuptools-scm rely on;
  # NOTE: * Python 3.13 dropped `cgi`, which gidgethub imports until
  # NOTE:   v5.2.1 — which in turn needs PyJWT 2.4+, dragging that floor
  # NOTE:   up along with it;
  # NOTE: * setuptools 35.0.2 is gone from here entirely — its
  # NOTE:   `pkg_resources` doesn't shadow a modern `packaging`, so
  # NOTE:   setuptools-scm trips over the removed
  # NOTE:   `packaging.version.LegacyVersion`.
  # NOTE: pytest-aiohttp is floored at v1 because v0 predates async
  # NOTE: fixture support, leaving `aiohttp`'s own pytest plugin to
  # NOTE: reject the async fixtures this suite defines.
  # NOTE: cryptography keeps its true 2.4.2 floor wherever that still
  # NOTE: resolves to a wheel, and is raised to 3.4.8 — the oldest
  # NOTE: release publishing arm64 macOS wheels — on Apple Silicon,
  # NOTE: where 2.4.2 would otherwise be built from source. 2.4.2 only
  # NOTE: ships an abi3 wheel for the Pythons it predates, hence the
  # NOTE: interpreter half of the marker.
  {envpython} -m pip install \
    'cryptography == 2.4.2; python_version < "3.9" and platform_machine != "arm64"' \
    'cryptography == 3.4.8; python_version >= "3.9" or platform_machine == "arm64"' \
    'gidgethub == 4.2.0; python_version < "3.13"' \
    'gidgethub == 5.2.1; python_version >= "3.13"' \
    'pyjwt == 1.4.2; python_version < "3.10"' \
    'pyjwt == 1.7.0; python_version >= "3.10" and python_version < "3.13"' \
    'pyjwt == 2.4.0; python_version >= "3.13"' \
    'pytest-aiohttp == 1.0.0' \
    'setuptools == 41; python_version < "3.12"' \
    'setuptools == 68.0.0; python_version >= "3.12"' \
    'setuptools-scm == 1.15.4; python_version < "3.12"' \
    'setuptools-scm == 8.0.4; python_version >= "3.12"'
setenv =
  PYTEST_ADDOPTS = -p no:warnings


[testenv:check-docs]
basepython = python3
isolated_build = true
# `usedevelop = true` overrides `skip_install` instruction, it's unwanted
usedevelop = false
## don't install octomachinery itself in this env
#skip_install = true
#usedevelop = true
extras =
  docs
#  testing
changedir = docs
commands =
    {envpython} -m sphinx \
      -b linkcheck \
      -j auto \
      {tty:--color} \
      -n \
      -d {toxinidir}/build/.doctrees \
      . \
      {toxinidir}/build/html


[testenv:build-docs]
basepython = python3
isolated_build = true
# `usedevelop = true` overrides `skip_install` instruction, it's unwanted
usedevelop = false
## don't install octomachinery itself in this env
#skip_install = true
#usedevelop = true
extras =
  docs
#  testing
changedir = docs
commands =
  # FIXME: Add -W option below once all other warnings are gone
  {envpython} -m sphinx \
    -j auto \
    -b html \
    {tty:--color} \
    -n \
    -d "{toxinidir}/build/.doctrees" \
    . \
    "{toxinidir}/build/html"

  # Print out the output docs dir and a way to serve html:
  -{envpython} -c \
  'import pathlib; docs_dir = pathlib.Path(r"{toxinidir}") / "build" / "html"; index_file = docs_dir / "index.html"; '\
  'print("\n" + "=" * 120 + f"\n\nDocumentation available under `file://\{index_file\}`\n\nTo serve docs, use `python3 -m http.server --directory \{docs_dir\} 0`\n\n" + "=" * 120)'


[testenv:build-dists]
description =
  Build dists and put them into the dist{/} folder
basepython = python3
isolated_build = true
# `usedevelop = true` overrides `skip_install` instruction, it's unwanted
usedevelop = false
# don't install octomachinery itself in this env
skip_install = true
deps =
  build >= 0.3.1, < 0.4.0
commands =
  {envpython} -c \
    "import shutil; \
    shutil.rmtree('{toxinidir}{/}dist{/}', ignore_errors=True)"

  {envpython} -m build \
    --outdir '{toxinidir}{/}dist{/}' \
    {posargs:--sdist --wheel} \
    '{toxinidir}'


[testenv:metadata-validation]
depends =
  build-dists
deps =
  twine
description =
  Verify that dists under the `dist{/}`
  dir have valid metadata
# Ref: https://twitter.com/di_codes/status/1044358639081975813
commands =
  {envpython} -m \
    twine check \
    {toxinidir}{/}dist{/}*

  # Install an sdist and a wheel into tmp dirs for further comparison
  {envpython} -c \
    "import shutil; \
    shutil.rmtree('{temp_dir}{/}.installed{/}', ignore_errors=True)"
  {envpython} -m \
    pip install octomachinery \
    --no-index \
    -f "{toxinidir}{/}dist{/}" \
    --no-deps \
    --only-binary octomachinery \
    --no-compile --no-cache-dir \
    -t "{temp_dir}{/}.installed{/}from-whl{/}"
  # Pre-download build deps for installing sdist
  {envpython} -m \
    pip download \
    setuptools \
    setuptools_scm \
    setuptools_scm_git_archive \
    wheel \
    -d "{temp_dir}{/}.build-deps{/}"
  {envpython} -m \
    pip install octomachinery \
    --no-index \
    -f "{toxinidir}{/}dist{/}" \
    -f "{temp_dir}{/}.build-deps{/}" \
    --no-deps \
    --no-binary octomachinery \
    --no-compile --no-cache-dir \
    -t "{temp_dir}{/}.installed{/}from-sdist{/}"

  # Normalize known content difference
  sh -c 'sed -i "s#^\(octomachinery-.*.dist-info/top_level.txt,sha256=\).*#\1#" \
  {temp_dir}{/}.installed{/}from-*{/}octomachinery-*.dist-info{/}RECORD'
  sh -c 'rm -rfv \
  {temp_dir}{/}.installed{/}from-*{/}octomachinery-*.dist-info{/}top_level.txt'

  # Compare wheel and sdist installs recursively as a smoke-test
  diff -ur \
    "{temp_dir}{/}.installed{/}from-whl" \
    "{temp_dir}{/}.installed{/}from-sdist"
skip_install = true
usedevelop = false
allowlist_externals =
  diff
  sh


[testenv:pre-commit]
isolated_build = true
deps =
  pre-commit
commands =
  {envpython} -m pre_commit run --show-diff-on-failure {posargs:--all-files}

  # Print out the advise of how to install pre-commit from this env into Git:
  -{envpython} -c \
  'cmd = "{envpython} -m pre_commit install"; scr_width = len(cmd) + 10; sep = "=" * scr_width; cmd_str = "    $ " + cmd; '\
  'print("\n" + sep + "\nTo install pre-commit hooks into the Git repo, run:\n\n" + cmd_str + "\n\n" + sep + "\n")'
skip_install = true
